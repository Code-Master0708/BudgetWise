<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BudgetWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="split-screen">
        <div class="left-panel">
            <div class="content-wrapper">
                <div class="brand">
                    <i class="fa-solid fa-chart-line logo-icon"></i> 
                    <span>BudgetWise</span>
                </div>
                
                <h1>Welcome Back to Smarter Budgeting.</h1>
                <p class="subtitle">Your AI-powered financial future awaits.</p>

                <form id="authForm">
                    <div class="input-container">
                        <i class="fa-regular fa-envelope icon"></i>
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>
                    
                    <div class="input-container">
                        <i class="fa-solid fa-lock icon"></i>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    
                    <div class="form-options">
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="cta-btn">Log In</button>
                    <div id="msg" class="message"></div>

                    <div class="divider">
                        <span>Or continue with</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="social-btn"><i class="fa-brands fa-google"></i></button>
                        <button type="button" class="social-btn"><i class="fa-brands fa-apple"></i></button>
                    </div>

                    <p class="switch-auth">Don't have an account? <a href="/signup">Sign Up</a></p>
                </form>
            </div>
        </div>

        <div class="right-panel">
            <div class="overlay-text">
                <h2>Predict Your Spending. Secure Your Future.</h2>
                <p>Let AI guide your financial journey.</p>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // Specific logic for Login
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            handleAuth('/api/login', {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
        });
    </script>
</body>
</html>
