<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BudgetWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-brain"></i> <span>BudgetWise</span>
            </div>
            <nav>
                <a href="#" class="active"><i class="fa-solid fa-table-columns"></i> Dashboard</a>
                <a href="/reports"><i class="fa-solid fa-chart-pie"></i> Reports</a>
                <div class="card budget-card">
    <h2 style="color: blue">Set Monthly Budget</h2>
    <div class="budget-display">
        <div class="budget-item">
            <span style='color: black'>Budget:</span>
            <span id="displayBudget" style='color: black'>₹0</span>
        </div>
        <div class="budget-item">
            <span style="color: #ef4444;">Spent:</span>
            <span id="displaySpent" style="color: #ef4444;">₹0</span>
        </div>
        <div class="budget-item">
            <span style="color: #10b981;">Remaining:</span>
            <span id="displayRemaining" style="color: #10b981; font-weight: bold;">₹0</span>
        </div>
    </div>
    <form id="budgetForm" style="margin-top: 15px;">
        <div class="input-group">
            <input type="number" id="monthlyBudget" placeholder="Enter Amount" required>
        </div>
        <button type="submit" class="primary-btn" style="background: #475569;">Update Budget</button>
    </form>
</div>
                
                <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="logout-section">
                <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header>
                <div class="welcome-text">
                    <h1>Welcome, {{ username }}!</h1>
                    <p>Current Month Spend: <span class="highlight" id="totalSpend">$0.00</span></p>
                </div>
                <div class="ai-widget">
                    <div class="icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                    <div class="text">
                        <small>AI Forecast</small>
                        <span>On track to save 15%</span>
                    </div>
                </div>
            </header>

            <div class="dashboard-grid">
                <div class="card form-card">
                    <h2>Add New Expense</h2>
                    <form id="expenseForm">
                        <div class="form-row">
                            <div class="input-group">
                                <label>Date</label>
                                <input type="date" id="date" required>
                            </div>
                            <div class="input-group">
                                <label>Category</label>
                                <select id="category" required>
                                    <option value="Food">🍔 Food</option>
                                    <option value="Transport">🚗 Transport</option>
                                    <option value="Utilities">💡 Utilities</option>
                                    <option value="Entertainment">🎬 Entertainment</option>
                                    <option value="Shopping">🛍️ Shopping</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>Amount (₹)</label>
                            <input type="number" id="amount" placeholder="0.00" required>
                        </div>

                        <div class="input-group">
                            <label>Description</label>
                            <input type="text" id="description" placeholder="What did you buy?">
                        </div>

                        <button type="submit" class="primary-btn">Add Expense</button>
                    </form>
                </div>

                <div class="right-column">
                    <div class="card recent-transactions">
                        <h3>Recent Transactions</h3>
                        <ul id="transactionList">
                            <li class="empty-state">No transactions yet.</li>
                        </ul>
                    </div>

                    <div class="card chart-card">
                        <h3>Spending by Category</h3>
                        <div class="chart-container">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='dashboard_script.js') }}"></script>
</body>
</html>
